<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Task Board v13-p4</title>
<!--
  v13-p4 (スマホUI/UX改善) 変更履歴
  [UI] 今日を中心にした日別折りたたみ表示
  [UI] 固定ボトムナビと自然な週順序へ変更
  [UI] クイック入力・タスクカード・保存表示を簡略化
  [UI] タップ領域、配色、iPhone安全領域を改善

  v13-p3 (スマホ起動安定化) 変更履歴
  [FIX] ブラウザ上のBabel変換を廃止し、事前変換済みapp.jsへ分離
  [FIX] 外部ライブラリをdefer読み込みに変更し、初期画面を先に表示
  [FIX] 起動失敗時に白画面ではなくエラーメッセージを表示
  [FIX] React / ReactDOMのCDNバージョンを固定

  v13-p2 (フェーズ2: データ整合性) 変更履歴
  [FIX] 来週・再来週の追加・編集・削除・並び替えが今週を誤更新する問題を修正
  [FIX] Supabase保存エラーの検知と保存処理の直列化
  [FIX] ルーティン編集時に既存IDと完了状態を維持
  [FIX] v2バックアップを別週に復元した際の日付ずれを修正
  [FIX] N週・N日ルーティンの重複判定に間隔と開始日を追加
  [DEL] APIキーが必要なAI週次レビュー機能を削除

  v13-p1 (フェーズ1: 信頼回復) 変更履歴
  [FIX] 並び替え: 重要タスク先頭ソート時に表示順と内部順がずれ、別のカードが動くバグを修正
  [FIX] ストックページ: TodoCardにisDone/sortIdx未指定で完了表示・並び替えが効かないバグを修正
  [FIX] バックアップ: 来週・過去週データ(amByDate/pmByDate)がエクスポートに含まれない欠損を修正 (version:2)
  [FIX] スマホ: 「今日へ自動スクロール」の対象idが未付与で一度も動いていなかった問題を修正
  [FIX] スマホ: カード上から画面スクロールできない問題を修正 (touchAction none→pan-y)
  [FIX] タッチドラッグ: 別の列に指が入ると誤った並び替えが起きるのを防止(列一致ガード)
  [FIX] 編集モーダル/ルーティン管理: nweekly・ndailyタイプのルーティンが編集保存で消失/「毎月」に化ける問題を修正(未知タイプ温存)
  [DEL] デッドコード削除: InboxColumn / displayTodos
-->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script>
(function(){
  window.showBootError=function(name){
    const show=function(){
      const root=document.getElementById("root");
      if(!root || !document.getElementById("boot-status")) return;
      root.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f6f8"><div style="max-width:360px;background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:24px;text-align:center"><div style="font-size:28px;margin-bottom:10px">⚠️</div><div style="font-size:15px;font-weight:700;margin-bottom:8px">アプリを読み込めませんでした</div><div style="font-size:12px;line-height:1.7;color:#777">通信状態を確認して、ページを再読み込みしてください。<br><span style="color:#aaa">'+String(name||"起動エラー")+'</span></div></div></div>';
    };
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",show,{once:true}); else show();
  };
  window.addEventListener("error",function(e){
    if(document.getElementById("boot-status")) window.showBootError(e.message||"JavaScriptエラー");
  });
  document.addEventListener("DOMContentLoaded",function(){
    setTimeout(function(){ if(document.getElementById("boot-status")) window.showBootError("読み込みがタイムアウトしました"); },15000);
  });
})();
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="showBootError('Supabaseの読み込みに失敗')"></script>
<script defer src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" onerror="showBootError('Reactの読み込みに失敗')"></script>
<script defer src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" onerror="showBootError('React DOMの読み込みに失敗')"></script>
<script defer src="./app.js?v=13-p4" onerror="showBootError('アプリ本体の読み込みに失敗')"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; background: #f5f6f8; }
</style>
</head>
<body>
<div id="root"><div id="boot-status" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;color:#888;background:#f5f6f8"><div style="text-align:center"><div style="font-size:30px;margin-bottom:12px">📋</div><div style="font-size:13px">Task Boardを読み込んでいます…</div></div></div></div>
</body>
</html>
